// Opt-in offscreen GL capture of the actual client renderers; no world edits.
allprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('java')) {
            def cacheRoot = new File(gradle.gradleUserHomeDir, 'caches')
            def natives = project.file("${project.buildDir}/bloodline-preview-natives")
            def lwjglNatives = project.fileTree(new File(cacheRoot, 'modules-2/files-2.1/org.lwjgl.lwjgl/lwjgl-platform')) {
                include '**/*natives-windows.jar'
            }
            project.tasks.create(name: 'prepareBloodlineNatives', type: Copy) {
                from { lwjglNatives.collect { project.zipTree(it) } }
                include '*.dll'
                into natives
            }
            project.tasks.create(name: 'captureBloodlineRender', type: JavaExec) {
                dependsOn project.tasks.testClasses, project.tasks.prepareBloodlineNatives
                classpath = project.sourceSets.test.runtimeClasspath
                main = 'net.narutomod.client.BloodlineRenderCapture'
                workingDir project.projectDir
                systemProperty 'java.library.path', natives.absolutePath
                args project.projectDir.absolutePath,
                    new File(cacheRoot, 'forge_gradle/minecraft_repo/versions/1.12.2/client.jar').absolutePath,
                    project.file("${project.buildDir}/reports/bloodline-render").absolutePath
            }
        }
    }
}
